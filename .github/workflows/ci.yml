name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go build
        working-directory: src
        run: go build -o /tmp/neuron-agent ./cmd/agent-server

      - name: Go test (short, full module)
        working-directory: src
        run: go test ./... -short -count=1 -timeout 20m

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build image
        run: docker build -t neuronagent:ci -f docker/Dockerfile .
